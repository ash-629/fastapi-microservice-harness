[project]
name = "microservice-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2", "psutil>=6"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "jsonschema>=4", "types-jsonschema", "types-psutil"]
[project.scripts]
harness = "harness.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["tools/harness"]
[tool.uv.workspace]
members = ["services/*"]
[tool.pytest.ini_options]
pythonpath = ["services/orders/src", "services/inventory/src", "tools"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
