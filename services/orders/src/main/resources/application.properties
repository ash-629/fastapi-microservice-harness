spring.application.name=orders
studio.version=@project.version@
server.address=127.0.0.1
server.port=${PORT:8001}
studio.db-path=${DB_PATH:.runtime/orders.sqlite3}
studio.inventory-url=${INVENTORY_URL:http://127.0.0.1:8002}
studio.recovery=${RECOVERY_ENABLED:true}
springdoc.api-docs.path=/openapi.json
springdoc.writer-with-order-by-keys=true
spring.main.banner-mode=off
server.error.include-message=never
